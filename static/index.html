<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מדברים עברית</title>
  <style>
    :root { --accent: #2f6fdf; --text: #1d2433; --bg: #f6f8fc; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2rem; padding: 1.5rem;
      font-family: "Segoe UI", Arial, sans-serif; color: var(--text); background: var(--bg);
      text-align: center;
    }
    h1 { font-size: clamp(2.2rem, 7vw, 3.5rem); margin: 0; }
    p { font-size: clamp(1.4rem, 4.5vw, 2rem); margin: 0; }
    #talk {
      font-size: clamp(2rem, 8vw, 3.2rem); font-weight: bold; color: #fff;
      background: var(--accent); border: none; border-radius: 2rem;
      padding: 1.5rem 3.5rem; cursor: pointer; box-shadow: 0 6px 18px rgba(47,111,223,.35);
    }
    #talk:active { transform: scale(.97); }
    #status { min-height: 2.5rem; }
  </style>
</head>
<body>
  <h1>שלום! 👋</h1>
  <p>האימון היומי שלנו מחכה</p>
  <button id="talk" type="button">שנתחיל?</button>
  <p id="status" aria-live="polite"></p>
  <script>
    document.getElementById("talk").addEventListener("click", () => {
      document.getElementById("status").textContent = "בקרוב…";
    });
  </script>
</body>
</html>
