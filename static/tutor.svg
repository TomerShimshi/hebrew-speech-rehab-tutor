<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="המאמנת">
  <defs>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <!-- background -->
    <rect width="200" height="200" fill="#dbe7fb"/>
    <circle cx="100" cy="92" r="70" fill="#e8f0fd"/>
    <!-- hair, back layer (shoulder length) -->
    <path d="M52 88 C48 42 78 24 102 24 C130 24 154 44 150 90 L154 146 C140 156 122 150 118 140 L82 140 C78 150 60 156 46 146 Z" fill="#5a3a29"/>
    <!-- shoulders / blouse -->
    <path d="M28 200 C30 162 58 146 100 146 C142 146 170 162 172 200 Z" fill="#3f7fcf"/>
    <path d="M84 147 L100 168 L116 147 C110 145 90 145 84 147 Z" fill="#f2c9a8"/>
    <!-- neck -->
    <path d="M88 124 L88 150 C94 156 106 156 112 150 L112 124 Z" fill="#e8b894"/>
    <!-- face -->
    <ellipse cx="100" cy="92" rx="34" ry="40" fill="#f2c9a8"/>
    <!-- ears + earrings -->
    <ellipse cx="66" cy="96" rx="6" ry="9" fill="#e8b894"/>
    <ellipse cx="134" cy="96" rx="6" ry="9" fill="#e8b894"/>
    <circle cx="66" cy="108" r="3" fill="#f0b429"/>
    <circle cx="134" cy="108" r="3" fill="#f0b429"/>
    <!-- hair, front fringe -->
    <path d="M66 82 C66 52 86 42 104 44 C124 46 138 60 136 84 C126 70 110 60 92 62 C82 64 72 72 66 82 Z" fill="#6b4632"/>
    <!-- eyebrows -->
    <path d="M78 80 C83 76 90 76 94 79" stroke="#4a2f22" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M106 79 C110 76 117 76 122 80" stroke="#4a2f22" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- eyes (gentle, smiling) -->
    <path d="M80 92 C84 88 90 88 93 92" stroke="#2d2320" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M107 92 C110 88 116 88 120 92" stroke="#2d2320" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="80" cy="106" rx="7" ry="4.5" fill="#eaa18a" opacity=".55"/>
    <ellipse cx="120" cy="106" rx="7" ry="4.5" fill="#eaa18a" opacity=".55"/>
    <!-- nose -->
    <path d="M100 96 C98 102 97 106 101 107" stroke="#d49c7a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M86 114 C92 122 108 122 114 114" stroke="#b5534a" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
