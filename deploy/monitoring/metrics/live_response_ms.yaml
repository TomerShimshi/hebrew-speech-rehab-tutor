description: "Her response time: his last words to her first output (sub-plan 19)"
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="hebrew-tutor" AND jsonPayload.event="live_response"'
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "ms"
valueExtractor: EXTRACT(jsonPayload.response_ms)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 20
    growthFactor: 1.4
    scale: 100
