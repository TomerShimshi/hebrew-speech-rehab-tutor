description: "A live session's estimated cost (sub-plan 19)"
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="hebrew-tutor" AND jsonPayload.event="live_session"'
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "USD"
valueExtractor: EXTRACT(jsonPayload.cost_usd)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 20
    growthFactor: 1.6
    scale: 0.001
