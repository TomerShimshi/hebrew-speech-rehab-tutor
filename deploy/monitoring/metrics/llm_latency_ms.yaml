description: "A model call's latency, retries included (sub-plan 19)"
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="hebrew-tutor" AND jsonPayload.event="llm_call"'
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "ms"
  labels:
  - key: model
    valueType: STRING
  - key: job
    valueType: STRING
valueExtractor: EXTRACT(jsonPayload.latency_ms)
labelExtractors:
  model: EXTRACT(jsonPayload.model)
  job: EXTRACT(jsonPayload.job)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 24
    growthFactor: 1.5
    scale: 100
