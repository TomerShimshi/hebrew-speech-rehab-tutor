description: "A model call's input tokens (sub-plan 19)"
filter: 'resource.type="cloud_run_revision" AND resource.labels.service_name="hebrew-tutor" AND jsonPayload.event="llm_call"'
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: "1"
  labels:
  - key: model
    valueType: STRING
  - key: job
    valueType: STRING
valueExtractor: EXTRACT(jsonPayload.input_tokens)
labelExtractors:
  model: EXTRACT(jsonPayload.model)
  job: EXTRACT(jsonPayload.job)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 20
    growthFactor: 2
    scale: 100
