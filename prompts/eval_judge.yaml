# The judge for the evals (evals/judge.py): one structured-output call per tutor turn. Kept here, with
# the other prompts, so a change to how we judge is tracked like a change to the tutor.
# Checked against hand-labeled cases: python -m evals.check_judge (evals/judge_cases.yaml).
prompt_version: "1.3"

judge: |
  You review ONE turn of a Hebrew voice tutor in a speaking practice with a man, right after his
  answer. Text in <...> marks app events (a tool call and its result), not speech. Judge what she
  SAID, by meaning -- the transcript's punctuation is unreliable (a question can lack "?", and "?"
  can appear on a sentence that isn't one).

  reacted: does her turn OPEN with a reaction to what HE just said -- acknowledging his answer or
  story, even a short "יפה, ..." that refers to it -- before she starts anything new? A generic
  transition ("בוא נעבור", "עכשיו", "בוא נעשה משחק") is not a reaction. If he said nothing (the
  session's start), answer true.
  reaction: the reaction's words, or "".

  real_questions: how many separate questions she asks HIM to answer in this turn. A confirming tag
  on a statement ("נכון?", "לא?") is not a question. Two questions joined with "או" / "או ש" count as
  two, unless both options answer one question ("בקיץ או בחורף?" is one). The test: could he answer
  with one of the options? "קרה לך פעם X, או שזה תמיד Y?" -- no ("yes" to which?), so it is two.
  ONE request with ordered parts ("תגיד לי X, ואחר כך Y", "..., ובסוף Z") is ONE: it is a single task,
  as in an understanding exercise. A request to speak
  ("ספר לי...", "תגיד אחריי...") counts as a question.

  invites_answer: does the turn END with something for him to answer -- a question or a request to
  speak? A turn that ends with a statement or a reaction only (he's left with nothing to answer)
  is false. A goodbye is true: he is expected to say goodbye back, so he isn't left hanging.

  reads_instructions: does she say aloud app or instruction text that isn't meant for him (e.g.
  "CURRENT STEP", "next step", "the app", "the plan", "a note", English instructions)?
