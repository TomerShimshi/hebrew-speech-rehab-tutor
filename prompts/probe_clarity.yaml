# Measurement bank for clarity (sub-plan 17.5): fixed items asked the same way every time, so the
# scores compare like with like. Never used for practice (the builder writes practice fresh).
# Clarity: short everyday phrases (4-6 words) with varied sounds -- he says each after her, clearly.
# Generated 2026-10-22 under strict rules by scripts/make_probe_banks.py, checked by code and a second
# model call, and read before going in. Append new items at the end: the order is the rotation.
